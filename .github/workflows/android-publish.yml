name: Publish Android npm release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android ARM64 run for this exact main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Ameer-Jamal/codex-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Verify successful source build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'build.json').read_text())
          assert run['conclusion'] == 'success', 'Android build must pass first'
          assert run['head_sha'] == os.environ['GITHUB_SHA'], 'Build must match this commit'
          assert run['head_branch'] == 'main'
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/android.yml'
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-android-arm64
          path: dist/android
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify package and record checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, tarfile
          from pathlib import Path
          manifest = json.loads(Path('codex-cli/package.json').read_text())
          version = manifest['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+-android\.[0-9]+', version)
          archive = Path(f'dist/android/codex-android-{version}.tgz')
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          sidecar = archive.with_name(archive.name + '.sha256').read_text().strip()
          assert sidecar == f'{digest}  {archive.name}'
          with tarfile.open(archive) as package:
              assert json.load(package.extractfile('package/package.json')) == manifest
              for name in ['README.md', 'LICENSE', 'NOTICE']:
                  assert package.extractfile('package/' + name).read() == Path(name).read_bytes()
          print(f'Package: codex-android@{version}; SHA-256: {digest}')
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write(f'PACKAGE_ARCHIVE={archive}\nPACKAGE_VERSION={version}\nPACKAGE_SHA256={digest}\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
              output.write(f'Package: `codex-android@{version}`\n\nSHA-256: `{digest}`\n')
          PY
      - name: Require emulator acceptance of this artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/commits/$GITHUB_SHA/status" > "$RUNNER_TEMP/status.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          statuses = json.loads((Path(os.environ['RUNNER_TEMP']) / 'status.json').read_text())['statuses']
          acceptance = next((s for s in statuses if s['context'] == 'android/emulator-api37'), None)
          assert acceptance and acceptance['state'] == 'success', 'Exact source needs Android 17 emulator acceptance'
          assert acceptance['description'] == 'Emulator passed; SHA256 ' + os.environ['PACKAGE_SHA256'][:16], 'Emulator must test this artifact'
          PY
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Publish through npm trusted publishing
        run: npm publish "$PACKAGE_ARCHIVE" --access public --tag latest --ignore-scripts
      - name: Verify public registry artifact and attach GitHub release
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/registry"
          cd "$RUNNER_TEMP/registry"
          for attempt in {1..7}; do
            if npm pack --ignore-scripts "codex-android@$PACKAGE_VERSION"; then break; fi
            if (( attempt == 7 )); then exit 1; fi
            sleep 60
          done
          archive="codex-android-$PACKAGE_VERSION.tgz"
          printf '%s  %s\n' "$PACKAGE_SHA256" "$archive" > "$archive.sha256"
          sha256sum -c "$archive.sha256"
          if ! gh release view "v$PACKAGE_VERSION" >/dev/null 2>&1; then
            gh release create "v$PACKAGE_VERSION" --target "$GITHUB_SHA" --prerelease \
              --title "Codex for Android $PACKAGE_VERSION" \
              --notes "Verified ARM64 Android build and Android 17 emulator acceptance. Early access; physical-device acceptance remains pending. SHA-256: $PACKAGE_SHA256"
          fi
          gh release upload "v$PACKAGE_VERSION" "$archive" "$archive.sha256" --clobber
