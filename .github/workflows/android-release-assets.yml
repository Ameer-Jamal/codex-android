name: Android release assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published codex-android npm version
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of the published tarball
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-assets-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Fetch and verify the published package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-android\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          # Newly approved stages can have a cached CDN 404 for five minutes.
          # Retry on the runner, without AI polling or local package transfers.
          downloaded=0
          for attempt in {1..7}; do
            if npm pack --ignore-scripts "codex-android@$PACKAGE_VERSION"; then
              downloaded=1
              break
            fi
            if (( attempt < 7 )); then
              echo "Registry download not ready; retrying in 60 seconds ($attempt/7)."
              sleep 60
            fi
          done
          [[ "$downloaded" == 1 ]]
          archive="codex-android-$PACKAGE_VERSION.tgz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" > "$archive.sha256"
          sha256sum -c "$archive.sha256"
      - name: Attach the matching runtime and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="codex-android-$PACKAGE_VERSION.tgz"
          gh release view "v$PACKAGE_VERSION"
          gh release upload "v$PACKAGE_VERSION" "$archive" "$archive.sha256" --clobber
